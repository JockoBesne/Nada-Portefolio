<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CIAN</title>
  <link rel="stylesheet" href="style-cian.css">
  <!-- J'ai ajouté des polices modernes ici qui correspondent au style "futuriste/néon" -->
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;700&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body>
  <!-- Spinner de chargement -->
  <div id="loading-spinner" class="spinner-container">
    <i class="fas fa-spinner fa-spin fa-3x"></i>
  </div>

  <header>
    <div class="container">
      <a href="index.html" class="logo">Retour</a>
    </div>
  </header>

  <main>
    <div class="container"> <!-- Ajout d'un conteneur global pour main -->
      <!-- Identification -->
      <section id="identification" class="content-section">
        <div class="identification-header">
          <p><strong>Darcel Nathan</strong></p>
          <p>Distanciel</p>
          <p>2025/2026</p>
        </div>
      </section>

      <!-- Activités -->
      <section id="activites" class="content-section">
        <!-- Contenu des activités inséré dynamiquement par JS -->
      </section>

      <!-- Stage -->
      <section id="stage" class="content-section">
        <!-- Contenu des stages inséré dynamiquement par JS -->
        <!-- J'ai laissé les articles vides ici, car ils seront remplis par JS.
             Les h1 d'exemple et articles vides n'ont plus lieu d'être si JS remplit tout. -->
      </section>
    </div>
  </main>

  <footer>
    <p>&copy; <span id="currentYear"></span> Votre Site</p>
  </footer>

  <script>
    // année courante
    document.getElementById('currentYear').textContent = new Date().getFullYear();
  </script>

  <script>
  /* -------------------------
     Gestion du spinner
     ------------------------- */
  const loadingSpinner = document.getElementById('loading-spinner');
  const mainContent = document.querySelector('main');

  function showSpinner() {
    if (loadingSpinner) loadingSpinner.classList.remove('hidden');
    if (mainContent) {
      mainContent.style.opacity = '0';
      mainContent.style.display = 'none';
    }
  }

  function hideSpinner() {
    if (loadingSpinner) loadingSpinner.classList.add('hidden');
    if (mainContent) {
      mainContent.style.display = 'block';
      setTimeout(() => { mainContent.style.opacity = '1'; }, 50);
    }
  }

  /* -------------------------
     Helper : construction URL média
     ------------------------- */
  const apiBase = 'https://cmspayload-q0ln.onrender.com/api';

  function makeMediaUrl(file) {
    let url = '';
    if (typeof file === 'string') url = file;
    else if (file && typeof file.url === 'string') url = file.url;

    if (url.startsWith('http://') || url.startsWith('https://')) return url;

    console.warn('URL de média inattendue:', url);
    return '';
  }

  /* -------------------------
     Gestion des blocs média
     ------------------------- */
  // Cette fonction est moins pertinente maintenant car nous gérons explicitement la présence d'audio
  // en le plaçant dans un wrapper séparé. Je la garde mais elle pourrait être simplifiée.
  function markMediaBlocks() {
    document.querySelectorAll('.activite, .presentation-entreprise, .rapport-hebdomadaire, .bilan')
      .forEach(block => {
        const hasImg = !!block.querySelector('.media img');
        const hasAudio = !!block.querySelector('.audio-player-wrapper audio'); // Vérifie le nouveau wrapper
        const hasLink = !!block.querySelector('.media a'); // Les liens d'annexes peuvent rester dans .media si pas de photos
                                                           // Ou être déplacés avec les audios si c'est plus clair visuellement

        // On peut ajouter une classe si le bloc a des images ET un audio pour des styles spécifiques
        if (hasImg && hasAudio) block.classList.add('has-visual-and-audio');
        else if (hasImg) block.classList.add('has-visual');
        else if (hasAudio) block.classList.add('has-audio-only'); // Utile pour des blocs sans image mais avec audio
        else block.classList.remove('has-visual-and-audio', 'has-visual', 'has-audio-only'); // Nettoyer les classes
      });
  }

  function debounce(fn, ms = 100) {
    let t;
    return (...args) => {
      clearTimeout(t);
      t = setTimeout(()=> fn(...args), ms);
    };
  }

  document.addEventListener('DOMContentLoaded', () => {
    markMediaBlocks();
    const main = document.querySelector('main');
    if (main) {
      const obs = new MutationObserver(debounce(markMediaBlocks, 80));
      obs.observe(main, { childList: true, subtree: true });
    }
  });

  /* -------------------------
     Rendu Activités
     ------------------------- */
  async function fetchActivites() {
    const container = document.getElementById('activites-container');
    try {
      const response = await fetch(`${apiBase}/activites`);
      if (!response.ok) throw new Error(`Erreur HTTP: ${response.status}`);
      const data = await response.json();
      const activities = data.docs || [];

      container.innerHTML = '<h1>Activités</h1>';

      if (activities.length === 0) {
        container.innerHTML += '<p>Aucune activité disponible.</p>';
        return;
      }

      activities.forEach(act => {
        const photosHtml = (act.photos || []).map(p => {
          const url = makeMediaUrl(p); // Utilise makeMediaUrl pour plus de robustesse
          const alt = p.alt || "Photo de l'activité";
          return url ? `<img src="${url}" alt="${alt.replace(/"/g, '&quot;')}" />` : '';
        }).join('');

        const audioHtml = (act.fichiersAudio || []).map(a => {
          const url = makeMediaUrl(a); // Utilise makeMediaUrl
          const titre = a.titre || 'Fichier audio';
          return url ? `<audio controls src="${url}" aria-label="${titre}"></audio>` : '';
        }).join('');

        // Construction de l'article avec le nouvel emplacement pour l'audio
        container.innerHTML += `
          <article class="activite" data-title="Activités"> <!-- Ajout de data-title pour le pseudo-élément CSS -->
            <div class="content">
              <h2>${act.mois || 'Mois non spécifié'}</h2>
              <p><strong>Activité :</strong> ${act.description || 'Description non disponible.'}</p>
              <p><strong>Lieu :</strong> ${act.lieu || '-'}</p>
              <p><strong>Rôle :</strong> ${act.role || '-'}</p>
            </div>
            ${photosHtml ? `<div class="media">${photosHtml}</div>` : ''} <!-- Le div media est ajouté seulement s'il y a des photos -->
            ${audioHtml ? `<div class="audio-player-wrapper">${audioHtml}</div>` : ''} <!-- Le wrapper audio est ajouté s'il y a de l'audio -->
          </article>
        `;
      });

      markMediaBlocks(); // Re-marquer les blocs après l'insertion

    } catch (err) {
      console.error('Erreur Activités:', err);
      container.innerHTML = '<p>Erreur lors du chargement des activités.</p>';
    }
  }

  /* -------------------------
     Rendu Stages
     ------------------------- */
  async function fetchStages() {
    const container = document.getElementById('stage-container');
    try {
      const response = await fetch(`${apiBase}/stage`);
      if (!response.ok) throw new Error(`Erreur HTTP: ${response.status}`);
      const data = await response.json();
      const stages = data.docs || [];

      container.innerHTML = '<h1>Stages</h1>';

      if (stages.length === 0) {
        container.innerHTML += '<p>Aucun stage disponible.</p>';
        return;
      }

      stages.forEach(stage => {
        // --- PRÉSENTATION ENTREPRISE ---
        const presPhotosHtml = (stage.photos_presentation || []).map(p => { // Supposons un champ spécifique pour les photos de présentation
          const url = makeMediaUrl(p);
          const alt = p.alt || 'Photo entreprise';
          return url ? `<img src="${url}" alt="${alt.replace(/"/g, '&quot;')}" />` : '';
        }).join('');

        const presAudioHtml = (stage.fichiersAudio_presentation || []).map(a => { // Supposons un champ spécifique
          const url = makeMediaUrl(a);
          const titre = a.titre || 'Audio présentation';
          return url ? `<audio controls src="${url}" aria-label="${titre}"></audio>` : '';
        }).join('');

        container.innerHTML += `
          <article class="presentation-entreprise" data-title="Présentation de l'entreprise">
            <div class="content">
              <h2>Présentation de l'entreprise</h2>
              <p><strong>Nom :</strong> ${stage.nom_entreprise || 'Nom non spécifié'}</p>
              <p><strong>Description :</strong> ${stage.description || 'Description non disponible.'}</p>
              ${stage.lien ? `<p><a href="${stage.lien}" target="_blank" rel="noopener">Site web de l'entreprise</a></p>` : ''}
            </div>
            ${presPhotosHtml ? `<div class="media">${presPhotosHtml}</div>` : ''}
            ${presAudioHtml ? `<div class="audio-player-wrapper">${presAudioHtml}</div>` : ''}
          </article>
        `;

        // --- RAPPORT HEBDOMADAIRE ---
        const semainesHtml = (stage.semaine || []).map(s => {
          const annexesHtml = (s.annexes || []).map(a => {
            const url = makeMediaUrl(a);
            const filename = a.nomFichier || 'Annexe';
            return url ? `<a href="${url}" download>${filename}</a>` : '';
          }).join(''); // On joint sans virgule si on veut les afficher en blocs séparés, ou avec ', ' si inline.

          const semainePhotosHtml = (s.photos_semaine || []).map(p => { // Supposons un champ photos par semaine
            const url = makeMediaUrl(p);
            const alt = p.alt || `Photo semaine ${s.numero}`;
            return url ? `<img src="${url}" alt="${alt.replace(/"/g, '&quot;')}" />` : '';
          }).join('');

          const semaineAudioHtml = (s.fichiersAudio_semaine || []).map(a => { // Supposons un champ audio par semaine
            const url = makeMediaUrl(a);
            const titre = a.titre || `Audio semaine ${s.numero}`;
            return url ? `<audio controls src="${url}" aria-label="${titre}"></audio>` : '';
          }).join('');


          return `
            <article class="rapport-hebdomadaire week-report" data-title="Semaine ${s.numero || ''}">
              <div class="content">
                <h3>Semaine ${s.numero || 'Non spécifié'}</h3>
                <ul>
                  <li><strong>Tâches :</strong> ${s.taches || '-'}</li>
                  <li><strong>Compétences :</strong> ${s.competences || '-'}</li>
                  <li><strong>Annexes :</strong> ${annexesHtml || 'Aucune annexe'}</li>
                </ul>
              </div>
              ${semainePhotosHtml ? `<div class="media">${semainePhotosHtml}</div>` : ''}
              ${semaineAudioHtml ? `<div class="audio-player-wrapper">${semaineAudioHtml}</div>` : ''}
            </article>
          `;
        }).join('');

        // Si `semainesHtml` contient plusieurs articles individuels, il faut les insérer.
        // Ou bien, si le rapport hebdomadaire est un seul article, la structure serait différente.
        // Je vais assumer que chaque semaine est un article pour le moment, mais cela pourrait être un seul grand article avec plusieurs sections de semaines.
        // Si vous avez un seul article "Rapport Hebdomadaire" qui contient toutes les semaines, ajustez ici.
        // Pour l'instant, je les ajoute directement au conteneur, mais il serait mieux d'avoir un wrapper s'il y a beaucoup de semaines.

        // Pour la structure donnée initialement, où `.rapport-hebdomadaire` est un seul article contenant toutes les semaines:
        const globalRapportHebdoPhotosHtml = (stage.photos_rapport_hebdo || []).map(p => { // Supposons un champ global pour le rapport
            const url = makeMediaUrl(p);
            const alt = p.alt || `Photo rapport hebdomadaire`;
            return url ? `<img src="${url}" alt="${alt.replace(/"/g, '&quot;')}" />` : '';
        }).join('');
        const globalRapportHebdoAudioHtml = (stage.fichiersAudio_rapport_hebdo || []).map(a => { // Supposons un champ global
            const url = makeMediaUrl(a);
            const titre = a.titre || `Audio rapport hebdomadaire`;
            return url ? `<audio controls src="${url}" aria-label="${titre}"></audio>` : '';
        }).join('');

        container.innerHTML += `
          <article class="rapport-hebdomadaire" data-title="Rapport Hebdomadaire">
            <div class="content">
              <h2>Rapport Hebdomadaire</h2>
              ${semainesHtml || '<p>Aucun rapport hebdomadaire disponible.</p>'}
            </div>
            ${globalRapportHebdoPhotosHtml ? `<div class="media">${globalRapportHebdoPhotosHtml}</div>` : ''}
            ${globalRapportHebdoAudioHtml ? `<div class="audio-player-wrapper">${globalRapportHebdoAudioHtml}</div>` : ''}
          </article>
        `;


        // --- BILAN ---
        const bilanPdfHtml = stage.bilan_pdf_url ? `<p><a href="${stage.bilan_pdf_url}" download>Télécharger le bilan en PDF</a></p>` : '';

        const bilanPhotosHtml = (stage.photos_bilan || []).map(p => { // Supposons un champ spécifique pour les photos du bilan
            const url = makeMediaUrl(p);
            const alt = p.alt || 'Photo bilan';
            return url ? `<img src="${url}" alt="${alt.replace(/"/g, '&quot;')}" />` : '';
        }).join('');

        const bilanAudioHtml = (stage.fichiersAudio_bilan || []).map(a => { // Supposons un champ spécifique pour l'audio du bilan
            const url = makeMediaUrl(a);
            const titre = a.titre || 'Audio bilan';
            return url ? `<audio controls src="${url}" aria-label="${titre}"></audio>` : '';
        }).join('');

        container.innerHTML += `
          <article class="bilan" data-title="Bilan">
            <div class="content">
              <h2>Bilan</h2>
              <p>${stage.bilan || 'Pas de bilan disponible.'}</p>
              ${bilanPdfHtml}
            </div>
            ${bilanPhotosHtml ? `<div class="media">${bilanPhotosHtml}</div>` : ''}
            ${bilanAudioHtml ? `<div class="audio-player-wrapper">${bilanAudioHtml}</div>` : ''}
          </article>
        `;
      });

      markMediaBlocks(); // Re-marquer les blocs après l'insertion

    } catch (err) {
      console.error('Erreur Stage:', err);
      container.innerHTML = '<p>Erreur lors du chargement des stages.</p>';
    }
  }

  /* -------------------------
     Chargement global
     ------------------------- */
  document.addEventListener('DOMContentLoaded', async () => {
    showSpinner();
    try {
      // J'ai ajouté un wrapper .container autour du main content pour centrer le tout
      // Le container #identification-container et #activites-container n'est plus nécessaire car le .container global fait le travail
      // J'ai aussi ajouté la balise H1 dans les fonctions JS car c'est plus propre quand le contenu est dynamique
      await Promise.all([fetchActivites(), fetchStages()]);
    } finally {
      hideSpinner();
    }
  });
  </script>
</body>
</html>
